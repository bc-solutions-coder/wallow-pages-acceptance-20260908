name: Pages source identity acceptance
"on":
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      deployment: false
    permissions:
      contents: read
      actions: read
      pages: write
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact validated DocFX TAR
        run: python3 prepare-real.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: prepared-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Deploy with historical source identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          BUILD_SOURCE_SHA: dc5055a23238a2e7c66941f858ea47c543222f50
        run: PYTHONPATH=scripts python3 probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pages-protocol-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-proof.json
          if-no-files-found: ignore
          retention-days: 30
